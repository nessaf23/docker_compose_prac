cat << 'EOF' > nginx/nginx.conf
events { worker_connections 1024; }

http {
    # Внутренний DNS-сервер Docker (обязателен для динамического разрешения имен)
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/menu {
            set $menu_upstream http://menu-service:8080;
            proxy_pass $menu_upstream;
            proxy_set_header Host $host;
        }

        location /api/orders {
            set $orders_upstream http://order-service:8081;
            proxy_pass $orders_upstream;
            proxy_set_header Host $host;
        }
    }
}
EOF
