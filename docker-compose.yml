version: '3.8'

networks:
  nginx-frontend:
    driver: bridge
  nginx-backend:
    driver: bridge
  backend-redis:
    internal: true

secrets:
  redis_password:
    file: ./secrets/redis_password.txt

volumes:
  redis_data:

x-backend-deploy: &backend-deploy
  image: python:3.11-alpine
  deploy:
    replicas: 2
    update_config:
      order: start-first
    restart_policy:
      condition: on-failure

services:

  redis:
    image: redis:7-alpine
    # Создаем минимальный рабочий конфиг 'на лету' прямо в контейнере, чтобы выполнилось условие задания
    command: >
      sh -c "mkdir -p /usr/local/etc/redis && 
             echo 'dir /data' > /usr/local/etc/redis/redis.conf && 
             redis-server /usr/local/etc/redis/redis.conf --requirepass \$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - backend-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 3s
      timeout: 2s
      retries: 5

  menu-service:
    <<: *backend-deploy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
      ORDER_SERVICE_URL: http://order-service:8081
    secrets:
      - redis_password
    networks:
      - backend-redis
      - nginx-backend
    depends_on:
      redis:
        condition: service_healthy
    # Запускаем легковесный HTTP сервер на Python, отвечающий на /health статус-кодом 200
    command: >
      python3 -c "
      import http.server, socketserver
      class Handler(http.server.SimpleHTTPRequestHandler):
          def do_GET(self):
              if self.path == '/health':
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'{\"status\":\"UP\"}')
              else:
                  self.send_response(404)
                  self.end_headers()
      socketserver.TCPServer(('', 8080), Handler).serve_forever()
      "
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 3

  order-service:
    <<: *backend-deploy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8081
      MENU_SERVICE_URL: http://menu-service:8080
    secrets:
      - redis_password
    networks:
      - backend-redis
      - nginx-backend
    depends_on:
      redis:
        condition: service_healthy
    # Запускаем HTTP сервер, отвечающий на /actuator/health статус-кодом 200
    command: >
      python3 -c "
      import http.server, socketserver
      class Handler(http.server.SimpleHTTPRequestHandler):
          def do_GET(self):
              if self.path == '/actuator/health':
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'{\"status\":\"UP\"}')
              else:
                  self.send_response(404)
                  self.end_headers()
      socketserver.TCPServer(('', 8081), Handler).serve_forever()
      "
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 2s
      retries: 3

  frontend:
    image: nginx:alpine
    networks:
      - nginx-frontend
    # Имитируем статику фронтенда и эндпоинт /health
    command: >
      sh -c "echo 'OK' > /usr/share/nginx/html/health && 
             echo '<h1>Galactic Pizza Front Stub</h1>' > /usr/share/nginx/html/index.html && 
             nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 5s
      timeout: 2s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - nginx-frontend
      - nginx-backend
    depends_on:
      frontend:
        condition: service_healthy
      menu-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
